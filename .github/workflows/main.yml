name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Build with Gradle
      run: gradle build
      working-directory: MinecraftAIBuild-Fabric-1.21.11(1)/MinecraftAIBuild-Fabric-1.21.11

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apex-client
        path: '**/build/libs/*.jar'
